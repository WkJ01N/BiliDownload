name: Build and verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Test download core
        run: dotnet test tests/BiliDownload.Tests/BiliDownload.Tests.csproj
      - name: Enable MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Publish preview
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Verify package and install directory helper
        shell: pwsh
        run: ./scripts/test-install-directory.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: BiliDownload-Windows-x64-preview
          path: |
            artifacts/BiliDownload-*-windows-x64-portable.zip
            artifacts/BiliDownload-*-windows-x64-setup.exe
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build, test and lint
        working-directory: android
        run: bash ./gradlew assembleDebug testDebugUnitTest lintDebug --console plain
      - uses: actions/upload-artifact@v4
        with:
          name: BiliDownload-Android-preview
          path: android/app/build/outputs/apk/debug/app-debug.apk
